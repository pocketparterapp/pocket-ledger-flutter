name: Build Pocket Ledger Android APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-ledger-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.pocketpartner --project-name pocket_ledger
          fi
      - name: Set Android compile SDK to 35
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          target = next((p for p in candidates if p.exists()), None)
          if target is None:
              raise SystemExit('Android app Gradle file was not generated')
          source = target.read_text()
          if target.suffix == '.kts':
              updated, count = re.subn(r'compileSdk\\s*=\\s*flutter\\.compileSdkVersion', 'compileSdk = 35', source)
          else:
              updated, count = re.subn(r'compileSdk(?:Version)?\\s*=?\\s*flutter\\.compileSdkVersion', 'compileSdkVersion 35', source)
          if count == 0:
              raise SystemExit(f'Could not find Flutter compileSdk setting in {target}')
          target.write_text(updated)
          print(f'Updated {target} to compileSdk 35')
          PY
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart source (report only)
        continue-on-error: true
        run: flutter analyze
      - name: Build universal release APK
        run: flutter build apk --release
      - name: Verify APK output
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ledger-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
