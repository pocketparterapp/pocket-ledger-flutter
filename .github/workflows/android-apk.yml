name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: flutter create --platforms=android --project-name pocket_ledger .
      - name: Install dependencies
        run: flutter pub get
      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK signature and package
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ledger-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
